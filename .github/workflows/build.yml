name: Reusable Build

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
        description: 'Operating system (ubuntu-24.04, macos-15, macos-15-intel, windows-2022)'
      platform:
        required: true
        type: string
        description: 'Platform name for artifact naming (linux-x86_64, macos-arm64, macos-x86_64, windows-x86_64)'
      package:
        required: false
        type: boolean
        default: false
        description: 'Whether to package the build artifacts'
    outputs:
      artifact-name:
        value: ${{ jobs.build.outputs.artifact-name }}
        description: 'Name of the uploaded artifact'

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 360
    outputs:
      artifact-name: ${{ steps.package.outputs.artifact-name }}${{ steps.package-windows.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      # ===== System dependencies =====
      - name: Install dependencies (Linux)
        if: inputs.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libx11-dev libxrandr-dev libxi-dev libxxf86vm-dev autoconf autoconf-archive automake libtool

      - name: Install dependencies (macOS)
        if: startsWith(inputs.os, 'macos')
        run: brew install autoconf autoconf-archive automake libtool

      # ===== vcpkg setup with cache + retry =====
      - name: Cache vcpkg repository
        uses: actions/cache@v5
        id: cache-vcpkg-repo
        with:
          path: ${{ github.workspace }}/vcpkg
          key: vcpkg-repo-84bab45d415d22042bd0b9081aea57f362da3f35-${{ runner.os }}

      - name: Setup vcpkg
        shell: bash
        run: |
          # 缓存命中时也必须钉回基线 commit:缓存的 vcpkg 树可能处于任意
          # commit(2026-09 回归的漂移向量之一),不能因 cache-hit 跳过 checkout
          if [ ! -d vcpkg/.git ]; then
            git clone https://github.com/microsoft/vcpkg.git vcpkg
          fi
          cd vcpkg
          git checkout 84bab45d415d22042bd0b9081aea57f362da3f35
          if [ ! -f vcpkg.exe ]; then
            if [ "$RUNNER_OS" = "Windows" ]; then
              ./bootstrap-vcpkg.bat
            else
              ./bootstrap-vcpkg.sh
            fi
          fi

      - name: Cache vcpkg installed packages
        uses: actions/cache@v5
        id: cache-vcpkg-installed
        with:
          path: ${{ github.workspace }}/vcpkg_installed/
          key: ${{ runner.os }}${{ inputs.os == 'macos-15' && '-arm' || inputs.os == 'macos-15-intel' && '-x64' || '' }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
        # 注意: 不设 restore-keys 前缀回退——回退可能恢复用旧依赖版本编译的
        # 安装树, 造成"同一 commit 重编译行为漂移"(2026-09 回归的漂移向量之一)

      - name: Cache vcpkg downloads
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-downloads-${{ runner.os }}-

      # vcpkg install with retry loop
      # NOTE: removed --clean-after-build so retries reuse already-compiled packages
      - name: Install vcpkg dependencies (Unix with retry)
        if: steps.cache-vcpkg-installed.outputs.cache-hit != 'true' && runner.os != 'Windows'
        shell: bash
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: |
          VCPKG="${{ github.workspace }}/vcpkg/vcpkg"
          INSTALLED_DIR="${{ github.workspace }}/vcpkg_installed"
          MAX_ATTEMPTS=5

          EXTRA_FLAGS=""
          if [[ "${{ inputs.os }}" == macos* ]]; then
            EXTRA_FLAGS="--allow-unsupported"
          fi

          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "=========================================="
            echo "=== vcpkg install attempt $attempt / $MAX_ATTEMPTS ==="
            echo "=========================================="

            if "$VCPKG" install --recurse \
                --x-install-root "$INSTALLED_DIR" \
                --overlay-ports=${{ github.workspace }}/ports \
                $EXTRA_FLAGS; then
              echo "vcpkg install succeeded on attempt $attempt"
              exit 0
            fi

            echo "Attempt $attempt failed"
            # Remove corrupted partial downloads
            find "$INSTALLED_DIR" -name "*.download" -delete 2>/dev/null || true
            find "$INSTALLED_DIR" -name "*.partial" -delete 2>/dev/null || true

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              WAIT=$((attempt * 15))
              echo "Waiting ${WAIT}s before retry..."
              sleep $WAIT
            fi
          done

          echo "vcpkg install failed after $MAX_ATTEMPTS attempts"
          exit 1

      - name: Install vcpkg dependencies (Windows with retry)
        if: steps.cache-vcpkg-installed.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: |
          $vcpkg = "${{ github.workspace }}\vcpkg\vcpkg.exe"
          $installedDir = "${{ github.workspace }}\vcpkg_installed"
          $maxAttempts = 5

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "=== vcpkg install attempt $attempt / $maxAttempts ==="
            & $vcpkg install --recurse --x-install-root $installedDir --overlay-ports=${{ github.workspace }}\ports

            if ($LASTEXITCODE -eq 0) {
              Write-Host "vcpkg install succeeded on attempt $attempt"
              exit 0
            }

            Write-Host "Attempt $attempt failed"
            if ($attempt -lt $maxAttempts) {
              $wait = $attempt * 15
              Write-Host "Waiting ${wait}s before retry..."
              Start-Sleep -Seconds $wait
            }
          }

          Write-Host "vcpkg install failed after $maxAttempts attempts"
          exit 1

      # ===== Rust + Build =====
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build
        shell: bash
        run: cargo build -vv --release
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_HAS_BEEN_INSTALLED: 1

      # ===== Package =====
      - name: Package (Unix)
        id: package
        if: inputs.package && !startsWith(inputs.os, 'windows')
        run: |
          mkdir -p release
          cp target/release/_3dtile release/
          cp -r -v target/release/gdal release/
          cp -r -v target/release/proj release/
          cp -r -v target/release/osgPlugins-3.6.5 release/
          tar -czf _3dtile-${{ inputs.platform }}.tar.gz -C release .
          echo "artifact-name=${{ inputs.platform }}" >> $GITHUB_OUTPUT

      - name: Package (Windows)
        id: package-windows
        if: inputs.package && startsWith(inputs.os, 'windows')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release
          Copy-Item target/release/_3dtile.exe release/
          Copy-Item -Recurse target/release/gdal release/
          Copy-Item -Recurse target/release/proj release/
          Copy-Item -Recurse target/release/osgPlugins-3.6.5 release/
          # Copy any runtime DLLs cargo/cmake happened to place next to the exe (best-effort;
          # may be empty).
          Copy-Item target/release/*.dll release/ -ErrorAction SilentlyContinue
          # Then copy the vcpkg runtime DLLs (gdal/proj/zstd/basisu_encoder/meshoptimizer/
          # GeographicLib/sqlite3/osg*/OpenThreads and their transitive deps). Without these the
          # loader aborts with STATUS_DLL_NOT_FOUND (0xC0000135) before main() runs -- the previous
          # artifact's help.txt/version.txt were captured cmd errors precisely because the exe
          # could not start.
          $vcpkgBin = "vcpkg_installed/x64-windows/bin"
          if (-not (Test-Path $vcpkgBin)) {
            Write-Host "::error::vcpkg runtime bin dir not found at $vcpkgBin; the packaged exe would be missing DLLs"
            exit 1
          }
          Copy-Item "$vcpkgBin/*.dll" release/
          Write-Host "release/ now has $((Get-ChildItem release/*.dll).Count) DLLs"
          # Smoke-test: the exe must actually start. Catches missing-DLL packaging regressions at
          # CI time instead of shipping a broken zip.
          & "release/_3dtile.exe" --version
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::_3dtile.exe --version exited $LASTEXITCODE (still missing a DLL?)"
            exit 1
          }
          # ===== Conversion smoke gate =====
          # 真实转换一次样例数据, 断言瓦片产出与 geometricError > 0。
          # 拦截两类已发生过的回归: (a) osgb/shape 瓦片截断(265→29);
          # (b) geometricError 全 0(Cesium 永不细化, 预览全黑)。
          $env:PROJ_DATA = "$PWD/release/proj"
          $env:GDAL_DATA = "$PWD/release/gdal"
          $env:OSG_LIBRARY_PATH = "$PWD/release/osgPlugins-3.6.5"
          New-Item -ItemType Directory -Path smoke/osgb_in/Data/Tile_+000_+000 -Force | Out-Null
          Copy-Item data/test/test.osgb smoke/osgb_in/Data/Tile_+000_+000/Tile_+000_+000.osgb
          Set-Content -Path smoke/osgb_in/metadata.xml -Value '<?xml version="1.0" encoding="utf-8"?><ModelMetadata version="1"><SRS>ENU:31.15,114.51</SRS><SRSOrigin>0,0,0</SRSOrigin></ModelMetadata>'

          & "release/_3dtile.exe" -f osgb -i smoke/osgb_in -o smoke/osgb_out
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::osgb smoke conversion failed"; exit 1 }
          $osgbTs = Get-Content smoke/osgb_out/tileset.json -Raw | ConvertFrom-Json
          if (-not $osgbTs.root.geometricError -or $osgbTs.root.geometricError -le 0) {
            Write-Host "::error::osgb smoke: root geometricError=$($osgbTs.root.geometricError) (ge=0 回归: Cesium 永不细化)"
            exit 1
          }
          $osgbB3dm = (Get-ChildItem smoke/osgb_out -Recurse -Filter *.b3dm).Count
          if ($osgbB3dm -lt 1) { Write-Host "::error::osgb smoke: no b3dm emitted"; exit 1 }
          Write-Host "osgb smoke OK: ge=$($osgbTs.root.geometricError), b3dm=$osgbB3dm"

          & "release/_3dtile.exe" -f shape -i data/test/smoke_shape.shp -o smoke/shp_out --height height
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::shape smoke conversion failed"; exit 1 }
          $shpTs = Get-Content smoke/shp_out/tileset.json -Raw | ConvertFrom-Json
          if (-not $shpTs.root.geometricError -or $shpTs.root.geometricError -le 0) {
            Write-Host "::error::shape smoke: root geometricError=$($shpTs.root.geometricError)"
            exit 1
          }
          $shpB3dm = (Get-ChildItem smoke/shp_out -Recurse -Filter *.b3dm).Count
          if ($shpB3dm -lt 1) { Write-Host "::error::shape smoke: no b3dm emitted"; exit 1 }
          Write-Host "shape smoke OK: ge=$($shpTs.root.geometricError), b3dm=$shpB3dm"
          # ===== End conversion smoke gate =====
          Compress-Archive -Path release/* -DestinationPath _3dtile-${{ inputs.platform }}.zip
          echo "artifact-name=${{ inputs.platform }}" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        if: inputs.package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.platform }}
          path: _3dtile-${{ inputs.platform }}${{ startsWith(inputs.os, 'windows') && '.zip' || '.tar.gz' }}
